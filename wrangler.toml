name = "salki"
compatibility_date = "2025-01-01"
compatibility_flags = ["nodejs_compat"]
pages_build_output_dir = "build/client"

[build]
command = "npm ci && npm run build"

[[d1_databases]]
binding = "DB"
database_name = "salki-db"
database_id = "1a3ed8eb-432a-4107-85dc-1533db633ede"

